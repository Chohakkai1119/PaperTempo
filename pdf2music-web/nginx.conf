server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # nginx's stock mime.types does not know .mjs, which would otherwise be
    # served as application/octet-stream. Browsers refuse to load ES modules
    # (pdf.js's worker, fetched with new Worker(..., {type: "module"}) and as a
    # dynamic import) unless they come with a JavaScript MIME type. The include
    # is required: a types block replaces rather than extends the inherited map.
    include      /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    # Needed because the redirect-following proxy below uses a variable in
    # proxy_pass, which makes nginx resolve the host at request time.
    resolver         1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 10s;

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        application/javascript text/javascript application/wasm
                      application/json text/css image/svg+xml;

    client_max_body_size 64m;

    # homr publishes its ONNX weights as GitHub release assets, which are served
    # without CORS headers -- the browser cannot fetch them cross-origin, so they
    # are proxied through this origin instead. GitHub answers with a 302 to a
    # signed URL, which nginx has to follow explicitly.
    location /models/ {
        proxy_pass                https://github.com/liebharc/homr/releases/download/onnx_checkpoints/;
        proxy_set_header          Host github.com;
        proxy_ssl_server_name     on;
        proxy_intercept_errors    on;
        error_page                301 302 307 = @models_redirect;
        # GitHub's 302 carries a signed URL well over a kilobyte long, which
        # overflows the default 4k header buffer ("upstream sent too big header").
        proxy_buffer_size         32k;
        proxy_buffers             8 32k;
        proxy_busy_buffers_size   64k;
    }

    location @models_redirect {
        set $models_target        $upstream_http_location;
        proxy_pass                $models_target;
        proxy_set_header          Host $proxy_host;
        proxy_ssl_server_name     on;
        proxy_buffer_size         32k;
        proxy_buffers             8 32k;
        proxy_busy_buffers_size   64k;
        # The weights are ~125 MB; stream them rather than buffering to disk.
        proxy_buffering           off;
    }

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # index.html references content-hashed assets, so it must revalidate
        # on every load; without this, browsers heuristically cache it and
        # serve stale bundles for days after a deploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
